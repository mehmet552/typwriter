[package]
name = "typwriter"
version = "1.0.0"
edition = "2021"
description = "A typewriter-themed focused writing application with ambient atmospheres"
license = "GPL-3.0-or-later"
authors = ["Mehmet"]
repository = "https://github.com/mehmet/typwriter"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_12"] }
libadwaita = { version = "0.7", features = ["v1_4"] }
rodio = { version = "0.19", default-features = false, features = ["wav"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

