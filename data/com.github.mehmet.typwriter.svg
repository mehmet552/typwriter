<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d2d34"/>
      <stop offset="100%" stop-color="#18181c"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#e8dec8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e28743"/>
      <stop offset="100%" stop-color="#c15c2a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base / Shadow -->
  <rect x="14" y="24" width="100" height="92" rx="16" fill="black" opacity="0.25" filter="url(#shadow)"/>

  <!-- Paper sticking out of the carriage -->
  <rect x="34" y="10" width="60" height="42" rx="3" fill="url(#paperGrad)"/>
  <!-- Paper typing text lines -->
  <line x1="42" y1="18" x2="86" y2="18" stroke="#8a7e6b" stroke-width="2" stroke-linecap="round"/>
  <line x1="42" y1="24" x2="80" y2="24" stroke="#8a7e6b" stroke-width="2" stroke-linecap="round"/>
  <line x1="42" y1="30" x2="84" y2="30" stroke="#8a7e6b" stroke-width="2" stroke-linecap="round"/>
  <line x1="42" y1="36" x2="65" y2="36" stroke="#c15c2a" stroke-width="2" stroke-linecap="round"/>

  <!-- Platen / Carriage Roller -->
  <rect x="22" y="38" width="84" height="14" rx="7" fill="#121215" stroke="#3e3e48" stroke-width="1.5"/>
  <!-- Roller Knobs -->
  <rect x="16" y="41" width="8" height="8" rx="2" fill="#888894"/>
  <rect x="104" y="41" width="8" height="8" rx="2" fill="#888894"/>

  <!-- Typewriter Main Body -->
  <path d="M 18 52 L 110 52 L 116 112 Q 116 116 110 116 L 18 116 Q 12 116 12 112 L 18 52 Z" fill="url(#bodyGrad)" stroke="#3e3e48" stroke-width="1.5"/>

  <!-- Ribbon vibrator / Typebars guide -->
  <polygon points="64,48 56,62 72,62" fill="#3a3a44"/>
  <circle cx="64" cy="50" r="3" fill="url(#accentGrad)"/>

  <!-- Keyboard Well Frame -->
  <rect x="22" y="66" width="84" height="42" rx="6" fill="#121215" stroke="#2a2a32" stroke-width="1"/>

  <!-- Circular Typewriter Keys - Row 1 -->
  <circle cx="34" cy="74" r="4.5" fill="#2d2d35" stroke="#d4c5a9" stroke-width="1.2"/>
  <circle cx="46" cy="74" r="4.5" fill="#2d2d35" stroke="#d4c5a9" stroke-width="1.2"/>
  <circle cx="58" cy="74" r="4.5" fill="#2d2d35" stroke="#d4c5a9" stroke-width="1.2"/>
  <circle cx="70" cy="74" r="4.5" fill="#2d2d35" stroke="#d4c5a9" stroke-width="1.2"/>
  <circle cx="82" cy="74" r="4.5" fill="#2d2d35" stroke="#d4c5a9" stroke-width="1.2"/>
  <circle cx="94" cy="74" r="4.5" fill="#2d2d35" stroke="#d4c5a9" stroke-width="1.2"/>

  <!-- Row 2 -->
  <circle cx="37" cy="86" r="4.5" fill="#2d2d35" stroke="#d4c5a9" stroke-width="1.2"/>
  <circle cx="49" cy="86" r="4.5" fill="#2d2d35" stroke="#d4c5a9" stroke-width="1.2"/>
  <circle cx="61" cy="86" r="4.5" fill="#2d2d35" stroke="#d4c5a9" stroke-width="1.2"/>
  <circle cx="73" cy="86" r="4.5" fill="#2d2d35" stroke="#d4c5a9" stroke-width="1.2"/>
  <circle cx="85" cy="86" r="4.5" fill="#2d2d35" stroke="#d4c5a9" stroke-width="1.2"/>

  <!-- Row 3 - Space bar & Return -->
  <rect x="42" y="96" width="44" height="6" rx="3" fill="#2d2d35" stroke="#d4c5a9" stroke-width="1.2"/>
  <circle cx="92" cy="99" r="4" fill="url(#accentGrad)" stroke="#f5aa6b" stroke-width="1"/>
</svg>
